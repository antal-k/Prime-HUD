# Builds the manager for every platform. A pushed `v*` tag (equal to the
# package.json version) publishes the installers as a GitHub release; a manual
# run only builds them and keeps them as workflow artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            targets: --win nsis --x64
          - name: macos-arm64
            os: macos-26
            targets: --mac dmg --arm64
          - name: macos-x64
            os: macos-26-intel
            targets: --mac dmg --x64
          - name: linux-x64
            os: ubuntu-latest
            targets: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, package.json $version"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # postinstall rebuilds the native modules (sqlite3) for Electron on this platform.
      - run: npm ci

      - run: npm run build

      - run: npx electron-builder ${{ matrix.targets }} --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          - **Windows**: `jts-hud-*-setup.exe`. The installer is not signed, so SmartScreen may warn: *More info* → *Run anyway*.
          - **macOS**: `arm64.dmg` for Apple Silicon, `x64.dmg` for Intel. The app is not notarized, so the first launch is blocked: allow it under *System Settings* → *Privacy & Security* → *Open Anyway*, or run `xattr -dr com.apple.quarantine "/Applications/JTs Hud Manager.app"`.
          - **Linux**: the `AppImage` (`chmod +x`, then run it) or the `deb` package.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
